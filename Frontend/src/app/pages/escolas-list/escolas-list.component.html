<div class="min-h-screen bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-700">
  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <app-page-header
      title="Escolas"
      description="Gerencie as instituições de ensino"
      iconPath="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
      buttonText="Nova Escola"
      (buttonClick)="onNovaEscola()"
    ></app-page-header>

    <!-- Filters -->
    <app-filter-card (search)="load()">
      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
          <input
            type="text"
            [(ngModel)]="descricao"
            placeholder="Buscar por descrição..."
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all duration-300"
          />
        </div>
      </div>
    </app-filter-card>

    <!-- Table -->
    <app-data-table
      [columns]="columns"
      [data]="escolas"
      [editRoute]="'/escolas'"
      [idKey]="'codEscola'"
      [currentPage]="page"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      emptyMessage="Nenhuma escola encontrada"
      (deleteItem)="remove($event)"
      (pageChange)="onPageChange($event)"
    ></app-data-table>
  </main>
</div>
