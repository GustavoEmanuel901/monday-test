<div class="min-h-screen bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-700">
  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <app-page-header
      title="Alunos"
      description="Gerencie os alunos cadastrados"
      iconPath="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
      buttonText="Novo Aluno"
      (buttonClick)="onNovoAluno()"
    ></app-page-header>

    <!-- Filters -->
    <app-filter-card (search)="load()">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Nome</label>
        <input
          [(ngModel)]="nome"
          name="nome"
          placeholder="Filtrar por nome"
          class="px-4 py-2.5 border-2 border-gray-200 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-purple-600 focus:ring-4 focus:ring-purple-100 hover:border-gray-300"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">CPF</label>
        <input
          [(ngModel)]="cpf"
          name="cpf"
          placeholder="Filtrar por CPF"
          class="px-4 py-2.5 border-2 border-gray-200 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-purple-600 focus:ring-4 focus:ring-purple-100 hover:border-gray-300"
        />
      </div>
    </app-filter-card>

    <!-- Table -->
    <app-data-table
      [columns]="columns"
      [data]="alunos"
      [editRoute]="'/alunos'"
      [idKey]="'codAluno'"
      [currentPage]="page"
      [totalPages]="totalPages"
      [totalItems]="totalItems"
      emptyMessage="Nenhum aluno encontrado"
      (deleteItem)="remove($event)"
      (pageChange)="onPageChange($event)"
    ></app-data-table>
  </main>
</div>
