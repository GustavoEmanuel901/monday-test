@if (isAuthenticated$ | async) {
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center h-16">
        <!-- Logo e Menu -->
        <div class="flex items-center gap-8">
          <div class="flex items-center gap-3">
            <div class="bg-gradient-to-r from-purple-600 to-indigo-700 p-2 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
                ></path>
              </svg>
            </div>
            <span class="text-xl font-bold text-gray-800">Sistema</span>
          </div>

          <!-- Menu Items -->
          <div class="hidden md:flex items-center gap-2">
            <a
              routerLink="/alunos"
              routerLinkActive="bg-purple-100 text-purple-700"
              class="flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-gray-700 transition-all duration-300 hover:bg-purple-50 hover:text-purple-600"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                ></path>
              </svg>
              Alunos
            </a>

            <a
              routerLink="/escolas"
              routerLinkActive="bg-purple-100 text-purple-700"
              class="flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-gray-700 transition-all duration-300 hover:bg-purple-50 hover:text-purple-600"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                ></path>
              </svg>
              Escolas
            </a>
          </div>
        </div>

        <!-- Botão Sair -->
        <button
          (click)="logout()"
          class="flex items-center gap-2 px-5 py-2 bg-red-500 text-white rounded-lg font-medium transition-all duration-300 hover:bg-red-600 hover:-translate-y-0.5 hover:shadow-lg"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            ></path>
          </svg>
          Sair
        </button>
      </div>

      <!-- Menu Mobile -->
      <div class="md:hidden pb-3 flex gap-2">
        <a
          routerLink="/alunos"
          routerLinkActive="bg-purple-100 text-purple-700"
          class="flex items-center justify-center gap-2 flex-1 px-3 py-2 rounded-lg font-medium text-sm text-gray-700 transition-all duration-300 hover:bg-purple-50"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            ></path>
          </svg>
          Alunos
        </a>

        <a
          routerLink="/escolas"
          routerLinkActive="bg-purple-100 text-purple-700"
          class="flex items-center justify-center gap-2 flex-1 px-3 py-2 rounded-lg font-medium text-sm text-gray-700 transition-all duration-300 hover:bg-purple-50"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
            ></path>
          </svg>
          Escolas
        </a>
      </div>
    </div>
  </nav>
}
